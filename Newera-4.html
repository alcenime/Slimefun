<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:#06050d;
}

/* ── SCENE WRAPPER ── */
.scene{
  position:relative;
  width:100vw;
  height:850px;
  overflow:hidden;
}

/* ── LAYER: SKY (belakang) ── */
.layer-sky{
  position:absolute;
  inset:0;
  z-index:1;
  background:url('assets/dashboard/sky.png') center center / cover no-repeat;
}

/* ── LAYER: MID (tengah) ── */
.layer-mid{
  position:absolute;
  inset:0;
  z-index:2;
  background:url('assets/dashboard/mid.png') center bottom / cover no-repeat;
}

/* ── LAYER: GROUND / RUNE (paling depan background) ── */
.layer-ground{
  position:absolute;
  inset:0;
  z-index:3;
  background:url('assets/dashboard/ground.png') center bottom / cover no-repeat;
}

/* ── SLIME ── */
/* Rune center di ground.png: horizontal center, ~62% dari atas gambar */
/* ground.png di-cover dari bottom, jadi posisi rune di layar ~38% dari bawah */
.slime-wrap{
  position:absolute;
  z-index:4;
  left:50%;
  bottom:36%;
  transform:translateX(-50%) translateY(50%);
}

.slime-img{
  width:500px;
  height:auto;
  display:block;
  filter:
    drop-shadow(0 20px 60px rgba(0,0,0,0.6))
    drop-shadow(0 0 60px rgba(255,200,100,0.25));
}

/* ── AMBIENT GLOW di bawah slime ── */
.slime-glow{
  position:absolute;
  left:50%;
  bottom:36%;
  transform:translateX(-50%) translateY(50%);
  width:400px;
  height:60px;
  background:radial-gradient(ellipse, rgba(100,180,255,0.2) 0%, transparent 70%);
  z-index:3;
  pointer-events:none;
}
</style>
</head>
<body>
<div class="scene">
  <!-- Background layers -->
  <div class="layer-sky"></div>
  <div class="layer-mid"></div>
  <div class="layer-ground"></div>

  <!-- Ambient glow di rune -->
  <div class="slime-glow"></div>

  <!-- Slime -->
  <div class="slime-wrap">
    <img class="slime-img" src="assets/dashboard/slimo.png" alt="Slimo">
  </div>
</div>
</body>
</html>
