<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newera</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:#06050d;
}

/* ── TOPBAR ── */
.topbar{
  position:absolute;
  top:0;left:0;right:0;
  z-index:55;
  height:72px;
  display:flex;align-items:center;
  padding:0;gap:0;
  background:linear-gradient(90deg, rgba(8,6,24,0.97) 0%, rgba(11,18,32,0.95) 100%);
  border-bottom:1px solid rgba(198,168,90,0.35);
  box-shadow:0 2px 20px rgba(0,0,0,0.5);
}

/* Logo area kiri */
.topbar-logo{
  width:240px;flex-shrink:0;height:100%;
  display:flex;align-items:center;justify-content:center;
  border-right:1px solid rgba(198,168,90,0.2);
  padding:8px 16px;
}
.topbar-logo img{
  height:60px;width:auto;object-fit:contain;
  filter:drop-shadow(0 0 8px rgba(198,168,90,0.4));
}

/* Nav icons tengah */
.nav-icons{
  display:flex;align-items:center;gap:0;
  padding-left:1.5rem;height:72px;flex:1;
}
.nav-icon{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:0 1.2rem;cursor:pointer;
  border-bottom:2px solid transparent;
  height:100%;justify-content:center;
  transition:all 0.2s;position:relative;
}
.nav-icon.active{border-bottom-color:#C89F3D;}
.nav-icon.active::after{
  content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  width:6px;height:6px;background:#C89F3D;border-radius:50%;
}
.nav-icon:hover{background:rgba(198,168,90,0.05);}
.nav-icon img{
  width:28px;height:28px;object-fit:contain;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  transition:filter 0.2s;
}
.nav-icon.active img{filter:drop-shadow(0 0 10px rgba(200,159,61,0.9)) drop-shadow(0 2px 4px rgba(0,0,0,0.6));}
.nav-icon:hover img{filter:drop-shadow(0 0 6px rgba(200,159,61,0.6)) drop-shadow(0 2px 4px rgba(0,0,0,0.6));}
.nav-icon span{
  font-family:'Cinzel',serif;font-size:0.48rem;
  letter-spacing:0.12em;text-transform:uppercase;
  color:rgba(240,230,211,0.55);
  text-shadow:0 1px 4px rgba(0,0,0,0.9);
  transition:color 0.2s;
}
.nav-icon.active span{color:#F5D27A;}
.nav-icon:hover span{color:rgba(198,168,90,0.9);}

/* Kanan — currency + utility */
.topbar-right{
  display:flex;align-items:center;gap:0.5rem;
  padding-right:1.2rem;height:72px;
}
.currency{
  display:flex;align-items:center;gap:0.4rem;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(198,168,90,0.2);
  padding:0.3rem 0.8rem;border-radius:4px;
}
.currency img{width:18px;height:18px;object-fit:contain;filter:drop-shadow(0 0 5px rgba(255,200,0,0.8));}
.currency-val{
  font-family:'DM Mono',monospace;font-size:0.65rem;
  color:#E8C97A;letter-spacing:0.05em;font-weight:500;
}
.topbar-divider{width:1px;height:32px;background:rgba(198,168,90,0.15);margin:0 0.3rem;}
.topbar-btn{
  width:36px;height:36px;
  border:1px solid rgba(198,168,90,0.2);
  background:rgba(0,0,0,0.3);
  color:rgba(240,230,211,0.6);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;position:relative;border-radius:50%;
}
.topbar-btn:hover{border-color:#C6A85A;color:#C6A85A;background:rgba(198,168,90,0.08);}
.notif-dot{
  position:absolute;top:-2px;right:-2px;
  width:16px;height:16px;border-radius:50%;
  background:#ef4444;
  font-family:'DM Mono',monospace;font-size:0.35rem;
  color:white;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(5,4,16,0.8);
}

/* ── SIDEBAR ── */
.sidebar{
  position:absolute;
  top:0;left:0;
  z-index:60;
  width:240px;
  display:flex;flex-direction:column;
  align-items:stretch;
  padding:0;gap:0;
  background:transparent;
  overflow:visible;
}

/* Logo floating — bg ngikutin shape logo */
.sidebar-logo{
  height:100px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  background:transparent;
  padding:6px;
  pointer-events:none;
  position:relative;
}
.sidebar-logo::before{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(5,4,16,0.85);
  mask-image:url('assets/dashboard/logo.png');
  mask-size:contain;
  mask-repeat:no-repeat;
  mask-position:center;
  -webkit-mask-image:url('assets/dashboard/logo.png');
  -webkit-mask-size:contain;
  -webkit-mask-repeat:no-repeat;
  -webkit-mask-position:center;
}
.sidebar-logo img{
  height:90px;width:auto;object-fit:contain;
  position:relative;z-index:1;
}

.sidebar-gap{
  height:12px;flex-shrink:0;background:transparent;
}

/* Box menu */
.sidebar-box{
  display:flex;flex-direction:column;
  background:rgba(8,6,22,0.92);
  border:1px solid rgba(198,168,90,0.25);
  border-left:none;
  border-bottom:none;
  padding:4px 0;
}

.sidebar-item{
  display:flex;align-items:center;gap:0.9rem;
  padding:0.65rem 1.2rem;
  cursor:pointer;position:relative;
  border-left:3px solid transparent;
  transition:all 0.18s;
}
.sidebar-item:hover{
  background:rgba(198,168,90,0.08);
  border-left-color:rgba(198,168,90,0.5);
}
.sidebar-item.active{
  background:linear-gradient(90deg,rgba(200,159,61,0.2) 0%,rgba(200,159,61,0.05) 100%);
  border-left-color:#C89F3D;
}
.sidebar-item img{
  width:26px;height:26px;object-fit:contain;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.7));
  opacity:0.6;transition:all 0.18s;flex-shrink:0;
}
.sidebar-item:hover img,.sidebar-item.active img{
  opacity:1;
  filter:drop-shadow(0 0 8px rgba(200,159,61,0.8)) drop-shadow(0 2px 4px rgba(0,0,0,0.6));
}
.sidebar-item span{
  font-family:'Cinzel',serif;font-size:0.65rem;font-weight:600;
  letter-spacing:0.06em;text-transform:uppercase;
  color:rgba(240,230,211,0.5);
  text-shadow:0 1px 4px rgba(0,0,0,0.9);
  transition:color 0.18s;
}
.sidebar-item:hover span{color:rgba(245,210,122,0.9);}
.sidebar-item.active span{color:#F5D27A;}
.sidebar-badge{
  margin-left:auto;font-family:'DM Mono',monospace;
  font-size:0.38rem;padding:2px 6px;
  background:#ef4444;color:white;border-radius:3px;
}
.new-badge{
  margin-left:auto;
  background:rgba(212,175,55,0.15);border:1px solid rgba(212,175,55,0.5);
  color:#D4AF37;padding:2px 7px;
  font-size:0.38rem;font-family:'Cinzel',serif;letter-spacing:0.08em;
  border-radius:10px;
}
.sidebar-sep{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(198,168,90,0.2),transparent);
  margin:0.25rem 1rem;
}


/* Special Pack */
.special-pack{
  position:relative;cursor:pointer;transition:all 0.2s;
  width:260px;
  background:rgba(8,6,22,0.92);
  border:1px solid rgba(198,168,90,0.25);
  border-left:none;border-top:none;
  padding:4px 4px 4px 0;
}
.special-pack:hover{border-color:rgba(198,168,90,0.5);}
.special-pack-img{width:100%;height:auto;display:block;border-radius:4px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6));}
.special-pack-notif{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#ef4444;}

/* Mood/Happy section */
.mood-section{
  position:relative;
  width:260px;
  background:rgba(8,6,22,0.92);
  border:1px solid rgba(198,168,90,0.25);
  border-left:none;border-top:none;
  padding:8px 10px 8px 0;
  display:flex;align-items:center;gap:8px;
}
.mood-avatar{
  width:44px;height:44px;border-radius:50%;
  border:2px solid rgba(198,168,90,0.4);
  overflow:hidden;flex-shrink:0;
  background:#1a1228;
}
.mood-avatar img{width:100%;height:100%;object-fit:cover;}
.mood-info{flex:1;min-width:0;}
.mood-label{font-family:'DM Mono',monospace;font-size:0.36rem;color:rgba(240,230,211,0.4);letter-spacing:0.1em;text-transform:uppercase;}
.mood-status{font-family:'Cinzel',serif;font-size:0.6rem;font-weight:700;color:#F5D27A;letter-spacing:0.06em;}
.mood-bar-row{display:flex;align-items:center;gap:6px;margin-top:4px;}
.mood-gem{width:12px;height:12px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(150,0,255,0.6));}
.mood-val{font-family:'DM Mono',monospace;font-size:0.4rem;color:rgba(240,230,211,0.6);}
.mood-bar{flex:1;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}
.mood-bar-fill{height:100%;width:60%;background:linear-gradient(90deg,#ec4899,#f97316);border-radius:2px;}
.mood-plus{
  width:22px;height:22px;border-radius:50%;
  border:1px solid rgba(198,168,90,0.4);
  background:rgba(198,168,90,0.1);
  color:#C6A85A;font-size:0.9rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:all 0.2s;
}
.mood-plus:hover{background:rgba(198,168,90,0.25);border-color:#C6A85A;}

/* ── RIGHT PANEL ── */
.right-panel{
  position:absolute;
  top:0;right:0;bottom:0;
  z-index:40;
  width:240px;
  display:flex;flex-direction:column;
  padding:0 10px;
}

/* Profile box di atas */
.rp-profile{
  height:80px;
  display:flex;align-items:center;gap:0.7rem;
  flex-shrink:0;
  padding:120px 4px 0 4px;
}
.rp-profile-box{
  display:flex;align-items:center;gap:0.7rem;
  background:rgba(4,3,14,0.75);
  border:1px solid rgba(198,168,90,0.3);
  border-radius:12px;
  padding:8px 12px;
  width:100%;
}
.rp-avatar{
  width:44px;height:44px;border-radius:50%;
  border:2px solid #C6A85A;overflow:hidden;
  background:#1a1228;flex-shrink:0;
  box-shadow:0 0 12px rgba(198,168,90,0.3);
}
.rp-avatar img{width:100%;height:100%;object-fit:cover;}
.rp-info{flex:1;min-width:0;}
.rp-name{font-family:'Cinzel',serif;font-size:0.65rem;font-weight:700;color:#F0E6D3;letter-spacing:0.04em;text-shadow:0 1px 4px rgba(0,0,0,0.9);}
.rp-lv{font-family:'DM Mono',monospace;font-size:0.4rem;color:rgba(198,168,90,0.7);margin-top:2px;}
.rp-xpbar{width:100%;height:3px;background:rgba(255,255,255,0.1);margin-top:4px;border-radius:2px;overflow:hidden;}
.rp-xpfill{height:100%;width:68%;background:linear-gradient(90deg,#C6A85A,#FFD700);}
.rp-xppct{font-family:'DM Mono',monospace;font-size:0.36rem;color:rgba(198,168,90,0.5);margin-top:2px;}

/* gap antara cards */
.rp-gap{height:35px;flex-shrink:0;}

/* Event card — image only, no text overlay */
.rp-event{
  position:relative;overflow:hidden;cursor:pointer;
  border:1px solid rgba(198,168,90,0.2);flex-shrink:0;
  border-radius:10px;
  transition:border-color 0.2s;
}
.rp-event:hover{border-color:rgba(198,168,90,0.5);}
.rp-event img{width:100%;height:130px;object-fit:cover;object-position:center;display:block;}
.rp-notif{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#ef4444;}

/* Mystery box card */
.rp-mystery{
  display:flex;align-items:center;gap:0.5rem;
  border:1px solid rgba(198,168,90,0.18);
  background:rgba(8,5,18,0.5);
  padding:6px 8px;cursor:pointer;flex-shrink:0;
  border-radius:10px;
  transition:all 0.2s;position:relative;
}
.rp-mystery:hover{border-color:rgba(198,168,90,0.4);}
.rp-mystery img{width:50px;height:50px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6));}
.rp-mystery-info{flex:1;}
.rp-card-title{font-family:'Cinzel',serif;font-size:0.6rem;font-weight:700;color:#F0E6D3;letter-spacing:0.04em;}
.rp-card-sub{font-family:'DM Mono',monospace;font-size:0.38rem;color:rgba(240,230,211,0.45);margin-top:2px;}

/* Adventure card — image only, no text overlay */
.rp-adventure{
  position:relative;overflow:hidden;cursor:pointer;
  border:1px solid rgba(198,168,90,0.18);flex-shrink:0;
  transition:all 0.2s;
}
.rp-adventure:hover{border-color:rgba(198,168,90,0.4);}
.rp-adventure img{width:100%;height:120px;object-fit:cover;object-position:center;display:block;}

/* Mini cards row */
.rp-mini-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0;}
.rp-mini{
  border:1px solid rgba(198,168,90,0.15);
  background:rgba(8,5,18,0.5);
  padding:6px 8px;cursor:pointer;transition:all 0.2s;
  border-radius:10px;
}
.rp-mini:hover{border-color:rgba(198,168,90,0.35);}
.rp-mini-label{font-family:'DM Mono',monospace;font-size:0.32rem;letter-spacing:0.1em;color:rgba(198,168,90,0.5);text-transform:uppercase;margin-bottom:2px;}
.rp-mini-val{font-family:'Cinzel',serif;font-size:0.58rem;font-weight:700;color:#F0E6D3;}
.rp-mini-sub{font-family:'DM Mono',monospace;font-size:0.35rem;color:rgba(240,230,211,0.4);margin-top:1px;}

.rp-bottom-gap{height:16px;flex-shrink:0;}

/* ── SCENE WRAPPER ── */
.scene{
  position:relative;
  width:100vw;
  height:850px;
  overflow:hidden;
}

/* ── LAYER: SKY (belakang) ── */
.layer-sky{
  position:absolute;
  inset:0;
  z-index:1;
  background:url('assets/dashboard/sky.png') center center / cover no-repeat;
}

/* ── LAYER: MID (tengah) ── */
.layer-mid{
  position:absolute;
  inset:0;
  z-index:2;
  background:url('assets/dashboard/mid.png') center bottom / cover no-repeat;
}

/* ── LAYER: GROUND / RUNE (paling depan background) ── */
.layer-ground{
  position:absolute;
  inset:0;
  z-index:3;
  background:url('assets/dashboard/ground.png') center bottom / cover no-repeat;
}

/* ── SLIME ── */
/* Rune center di ground.png: horizontal center, ~62% dari atas gambar */
/* ground.png di-cover dari bottom, jadi posisi rune di layar ~38% dari bawah */
.slime-wrap{
  position:absolute;
  z-index:4;
  left:50%;
  bottom:42%;
  transform:translateX(-50%) translateY(50%);
}

.slime-img{
  width:500px;
  height:auto;
  display:block;
  filter:
    drop-shadow(0 20px 60px rgba(0,0,0,0.6))
    drop-shadow(0 0 60px rgba(255,200,100,0.25));
}

/* ── AMBIENT GLOW di bawah slime ── */
.slime-glow{
  position:absolute;
  left:50%;
  bottom:42%;
  transform:translateX(-50%) translateY(50%);
  width:400px;
  height:60px;
  background:radial-gradient(ellipse, rgba(100,180,255,0.2) 0%, transparent 70%);
  z-index:3;
  pointer-events:none;
}
</style>
</head>
<body>
<div class="scene">
  <!-- Background layers -->
  <div class="layer-sky"></div>
  <div class="layer-mid"></div>
  <div class="layer-ground"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <!-- Logo di atas -->
    <div class="sidebar-logo">
      <img src="assets/dashboard/logo.png" alt="Slime Runes">
    </div>
    <!-- Gap — sky keliatan -->
    <div class="sidebar-gap"></div>
    <!-- Box menu, tinggi ngikutin konten -->
    <div class="sidebar-box">
      <div class="sidebar-item active">
        <img src="assets/icons/sidebar/dashboard.png" alt=""><span>Dashboard</span>
      </div>
      <div class="sidebar-sep"></div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/heroes.png" alt=""><span>Heroes</span>
        <span class="sidebar-badge">3</span>
      </div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/equipment.png" alt=""><span>Equipment</span>
      </div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/alchemy.png" alt=""><span>Alchemy</span>
      </div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/collection.png" alt=""><span>Collection</span>
      </div>
      <div class="sidebar-sep"></div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/achievement.png" alt=""><span>Achievement</span>
      </div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/event.png" alt=""><span>Event</span>
        <span class="new-badge">NEW</span>
      </div>
      <div class="sidebar-sep"></div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/community.png" alt=""><span>Community</span>
      </div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/settings.png" alt=""><span>Settings</span>
      </div>
    </div>

    <!-- Special Pack — box sendiri di luar sidebar-box -->
    <div class="special-pack">
      <img class="special-pack-img" src="assets/icons/sidebar/special_pack.png" alt="">
      <div class="special-pack-notif"></div>
    </div>

    <!-- Mood/Happy -->
    <div class="mood-section">
      <div class="mood-avatar">
        <img src="assets/dashboard/slimo_mini.png" onerror="this.style.background='#ec4899'" alt="">
      </div>
      <div class="mood-info">
        <div class="mood-label">Mood</div>
        <div class="mood-status">Happy</div>
        <div class="mood-bar-row">
          <img class="mood-gem" src="assets/dashboard/gem.png" alt="">
          <span class="mood-val">120/200</span>
          <div class="mood-bar"><div class="mood-bar-fill"></div></div>
        </div>
      </div>
      <div class="mood-plus">+</div>
    </div>
  </aside>

  <!-- Logo area terpisah removed, now inside sidebar -->

  <!-- Topbar -->
  <header class="topbar">
    <!-- Logo kiri -->
    <div class="topbar-logo">
      <img src="assets/dashboard/logo.png" alt="Slime Runes">
    </div>

    <!-- Nav tengah -->
    <nav class="nav-icons">
      <div class="nav-icon active">
        <img src="assets/icons/navbar/home.png" alt=""><span>Home</span>
      </div>
      <div class="nav-icon">
        <img src="assets/icons/navbar/hero.png" alt=""><span>Hero</span>
      </div>
      <div class="nav-icon">
        <img src="assets/icons/navbar/inventory.png" alt=""><span>Inventory</span>
      </div>
      <div class="nav-icon">
        <img src="assets/icons/navbar/shop.png" alt=""><span>Shop</span>
      </div>
      <div class="nav-icon">
        <img src="assets/icons/navbar/quest.png" alt=""><span>Quest</span>
      </div>
    </nav>

    <!-- Kanan: currency + utility -->
    <div class="topbar-right">
      <div class="currency">
        <img src="assets/dashboard/coin.png" alt="">
        <span class="currency-val">1.426B</span>
      </div>
      <div class="currency">
        <img src="assets/dashboard/gem.png" alt="">
        <span class="currency-val">8,450</span>
      </div>
      <div class="currency">
        <img src="assets/dashboard/crystal.png" alt="">
        <span class="currency-val">125</span>
      </div>
      <div class="topbar-divider"></div>
      <button class="topbar-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <div class="notif-dot">3</div>
      </button>
      <button class="topbar-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <div class="notif-dot">1</div>
      </button>
    </div>
  </header>

  <!-- Ambient glow di rune -->
  <div class="slime-glow"></div>

  <!-- Slime -->
  <div class="slime-wrap">
    <img class="slime-img" src="assets/dashboard/slimo.png" alt="Slimo">
  </div>

  <!-- Right Panel -->
  <aside class="right-panel">
    <!-- Profile -->
    <div class="rp-profile">
      <div class="rp-profile-box">
