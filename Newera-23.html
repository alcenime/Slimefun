<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newera</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:#06050d;
}

/* ── TOPBAR ── */
.topbar{
  position:absolute;
  top:0;left:210px;right:240px;
  z-index:50;
  height:60px;
  display:flex;align-items:center;
  padding:0 1.2rem;gap:1rem;
  background:linear-gradient(180deg,rgba(4,3,12,0.75) 0%,rgba(8,6,20,0.3) 80%,transparent 100%);
  border-bottom:1px solid rgba(198,168,90,0.12);
}
.nav-icons{display:flex;align-items:center;gap:0.2rem;flex:1;}
.nav-icon{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:0.4rem 0.9rem;cursor:pointer;
  border-bottom:2px solid transparent;transition:all 0.2s;
}
.nav-icon.active{border-bottom-color:#C6A85A;}
.nav-icon:hover{border-bottom-color:rgba(198,168,90,0.4);}
.nav-icon img{width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6));transition:filter 0.2s;}
.nav-icon.active img,.nav-icon:hover img{filter:drop-shadow(0 0 8px rgba(198,168,90,0.8)) drop-shadow(0 2px 4px rgba(0,0,0,0.6));}
.nav-icon span{font-family:'Cinzel',serif;font-size:0.42rem;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,230,211,0.9);text-shadow:0 1px 4px rgba(0,0,0,0.9),0 0 8px rgba(0,0,0,0.8);transition:color 0.2s;}
.nav-icon.active span,.nav-icon:hover span{color:#FFD700;text-shadow:0 1px 6px rgba(0,0,0,0.9),0 0 12px rgba(198,168,90,0.6);}
.topbar-right{display:flex;align-items:center;gap:0.6rem;margin-left:auto;}
.currency{display:flex;align-items:center;gap:0.35rem;background:rgba(0,0,0,0.35);border:1px solid rgba(198,168,90,0.2);padding:0.25rem 0.7rem;}
.currency img{width:16px;height:16px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(255,200,0,0.8));}
.currency-val{font-family:'DM Mono',monospace;font-size:0.58rem;color:#E8C97A;letter-spacing:0.06em;}
.currency-add{width:18px;height:18px;border:1px solid rgba(198,168,90,0.2);background:rgba(198,168,90,0.1);color:#C6A85A;font-size:0.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.topbar-btn{width:32px;height:32px;border:1px solid rgba(198,168,90,0.2);background:rgba(0,0,0,0.3);color:rgba(240,230,211,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;position:relative;}
.topbar-btn:hover{border-color:#C6A85A;color:#C6A85A;}
.notif-dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#ef4444;}
.profile-top{display:flex;align-items:center;gap:0.5rem;background:rgba(0,0,0,0.4);border:1px solid rgba(198,168,90,0.2);padding:0.25rem 0.6rem 0.25rem 0.3rem;cursor:pointer;}
.profile-avatar{width:32px;height:32px;border-radius:50%;border:1px solid #C6A85A;overflow:hidden;background:#1a1228;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-info{display:flex;flex-direction:column;}
.profile-name{font-family:'Cinzel',serif;font-size:0.55rem;font-weight:700;color:#F0E6D3;letter-spacing:0.04em;}
.profile-lv{font-family:'DM Mono',monospace;font-size:0.42rem;color:rgba(198,168,90,0.6);}
.profile-xp{width:60px;height:3px;background:rgba(255,255,255,0.1);margin-top:2px;}
.profile-xp-fill{height:100%;width:68%;background:linear-gradient(90deg,#C6A85A,#FFD700);}

/* ── SIDEBAR ── */
.sidebar{
  position:absolute;
  top:0;left:0;bottom:0;
  z-index:40;
  width:210px;
  display:flex;flex-direction:column;
  padding:0 12px;
  gap:0;
}
/* Logo area di atas */
.sidebar-logo{
  height:80px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.sidebar-logo img{
  height:64px;width:auto;object-fit:contain;
  mix-blend-mode:lighten;
  filter:drop-shadow(0 0 10px rgba(198,168,90,0.5));
}
/* space antara logo dan box */
.sidebar-gap{height:12px;flex-shrink:0;}

/* Box yang wrap menu items */
.sidebar-box{
  flex:1;
  display:flex;flex-direction:column;
  background:linear-gradient(135deg,rgba(4,3,14,0.82) 0%,rgba(8,5,22,0.75) 100%);
  border:1px solid rgba(198,168,90,0.25);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.04),
    0 8px 40px rgba(0,0,0,0.5),
    0 0 0 1px rgba(198,168,90,0.08);
  overflow:hidden;
  padding:0.4rem 0;
  /* corner ornamen */
  position:relative;
}
/* corner gold */
.sidebar-box::before,.sidebar-box::after{
  content:'';position:absolute;
  width:8px;height:8px;
  border-color:rgba(198,168,90,0.6);border-style:solid;
}
.sidebar-box::before{top:4px;left:4px;border-width:1px 0 0 1px;}
.sidebar-box::after{top:4px;right:4px;border-width:1px 1px 0 0;}

/* kosong di bawah box */
.sidebar-bottom-gap{height:16px;flex-shrink:0;}

.sidebar-item{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.6rem 1rem 0.6rem 1rem;
  cursor:pointer;position:relative;
  border-left:2px solid transparent;
  transition:all 0.18s;
}
.sidebar-item:hover{
  background:rgba(198,168,90,0.07);
  border-left-color:rgba(198,168,90,0.4);
}
.sidebar-item.active{
  background:linear-gradient(90deg,rgba(198,168,90,0.18) 0%,rgba(198,168,90,0.04) 100%);
  border-left-color:#C6A85A;
}
.sidebar-item img{
  width:20px;height:20px;object-fit:contain;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.7));
  opacity:0.65;transition:all 0.18s;flex-shrink:0;
}
.sidebar-item:hover img,.sidebar-item.active img{
  opacity:1;
  filter:drop-shadow(0 0 6px rgba(198,168,90,0.7)) drop-shadow(0 2px 4px rgba(0,0,0,0.6));
}
.sidebar-item span{
  font-family:'Cinzel',serif;font-size:0.58rem;font-weight:600;
  letter-spacing:0.08em;text-transform:uppercase;
  color:rgba(240,230,211,0.45);
  text-shadow:0 1px 4px rgba(0,0,0,0.9);
  transition:color 0.18s;
}
.sidebar-item:hover span{color:rgba(198,168,90,0.9);}
.sidebar-item.active span{color:#E8C97A;}
.sidebar-badge{
  margin-left:auto;font-family:'DM Mono',monospace;
  font-size:0.34rem;padding:1px 5px;
  background:#ef4444;color:white;border-radius:2px;
}
.new-badge{
  margin-left:auto;
  background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.5);
  color:#4ade80;padding:1px 6px;
  font-size:0.34rem;font-family:'DM Mono',monospace;letter-spacing:0.1em;
}
.sidebar-sep{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(198,168,90,0.15),transparent);
  margin:0.25rem 0.8rem;
}
/* settings push ke bawah */
.sidebar-spacer{flex:1;}
.sidebar-settings-sep{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(198,168,90,0.2),transparent);
  margin:0.25rem 0.8rem;
}


/* ── RIGHT PANEL ── */
.right-panel{
  position:absolute;
  top:0;right:0;bottom:0;
  z-index:40;
  width:240px;
  display:flex;flex-direction:column;
  padding:0 10px;
}

/* Profile box di atas */
.rp-profile{
  height:80px;
  display:flex;align-items:center;gap:0.7rem;
  flex-shrink:0;
  padding:90px 4px 0 4px;
}
.rp-avatar{
  width:44px;height:44px;border-radius:50%;
  border:2px solid #C6A85A;overflow:hidden;
  background:#1a1228;flex-shrink:0;
  box-shadow:0 0 12px rgba(198,168,90,0.3);
}
.rp-avatar img{width:100%;height:100%;object-fit:cover;}
.rp-info{flex:1;min-width:0;}
.rp-name{font-family:'Cinzel',serif;font-size:0.65rem;font-weight:700;color:#F0E6D3;letter-spacing:0.04em;text-shadow:0 1px 4px rgba(0,0,0,0.9);}
.rp-lv{font-family:'DM Mono',monospace;font-size:0.4rem;color:rgba(198,168,90,0.7);margin-top:2px;}
.rp-xpbar{width:100%;height:3px;background:rgba(255,255,255,0.1);margin-top:4px;border-radius:2px;overflow:hidden;}
.rp-xpfill{height:100%;width:68%;background:linear-gradient(90deg,#C6A85A,#FFD700);}
.rp-xppct{font-family:'DM Mono',monospace;font-size:0.36rem;color:rgba(198,168,90,0.5);margin-top:2px;}

/* gap antara cards */
.rp-gap{height:20px;flex-shrink:0;}

/* Event card — image only, no text overlay */
.rp-event{
  position:relative;overflow:hidden;cursor:pointer;
  border:1px solid rgba(198,168,90,0.2);flex-shrink:0;
  transition:border-color 0.2s;
}
.rp-event:hover{border-color:rgba(198,168,90,0.5);}
.rp-event img{width:100%;height:90px;object-fit:cover;object-position:center;display:block;}
.rp-notif{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#ef4444;}

/* Mystery box card */
.rp-mystery{
  display:flex;align-items:center;gap:0.5rem;
  border:1px solid rgba(198,168,90,0.18);
  background:rgba(8,5,18,0.5);
  padding:6px 8px;cursor:pointer;flex-shrink:0;
  transition:all 0.2s;position:relative;
}
.rp-mystery:hover{border-color:rgba(198,168,90,0.4);}
.rp-mystery img{width:50px;height:50px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6));}
.rp-mystery-info{flex:1;}
.rp-card-title{font-family:'Cinzel',serif;font-size:0.6rem;font-weight:700;color:#F0E6D3;letter-spacing:0.04em;}
.rp-card-sub{font-family:'DM Mono',monospace;font-size:0.38rem;color:rgba(240,230,211,0.45);margin-top:2px;}

/* Adventure card — image only, no text overlay */
.rp-adventure{
  position:relative;overflow:hidden;cursor:pointer;
  border:1px solid rgba(198,168,90,0.18);flex-shrink:0;
  transition:all 0.2s;
}
.rp-adventure:hover{border-color:rgba(198,168,90,0.4);}
.rp-adventure img{width:100%;height:80px;object-fit:cover;object-position:center bottom;display:block;}

/* Mini cards row */
.rp-mini-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0;}
.rp-mini{
  border:1px solid rgba(198,168,90,0.15);
  background:rgba(8,5,18,0.5);
  padding:6px 8px;cursor:pointer;transition:all 0.2s;
}
.rp-mini:hover{border-color:rgba(198,168,90,0.35);}
.rp-mini-label{font-family:'DM Mono',monospace;font-size:0.32rem;letter-spacing:0.1em;color:rgba(198,168,90,0.5);text-transform:uppercase;margin-bottom:2px;}
.rp-mini-val{font-family:'Cinzel',serif;font-size:0.58rem;font-weight:700;color:#F0E6D3;}
.rp-mini-sub{font-family:'DM Mono',monospace;font-size:0.35rem;color:rgba(240,230,211,0.4);margin-top:1px;}

.rp-bottom-gap{height:16px;flex-shrink:0;}

/* ── SCENE WRAPPER ── */
.scene{
  position:relative;
  width:100vw;
  height:850px;
  overflow:hidden;
}

/* ── LAYER: SKY (belakang) ── */
.layer-sky{
  position:absolute;
  inset:0;
  z-index:1;
  background:url('assets/dashboard/sky.png') center center / cover no-repeat;
}

/* ── LAYER: MID (tengah) ── */
.layer-mid{
  position:absolute;
  inset:0;
  z-index:2;
  background:url('assets/dashboard/mid.png') center bottom / cover no-repeat;
}

/* ── LAYER: GROUND / RUNE (paling depan background) ── */
.layer-ground{
  position:absolute;
  inset:0;
  z-index:3;
  background:url('assets/dashboard/ground.png') center bottom / cover no-repeat;
}

/* ── SLIME ── */
/* Rune center di ground.png: horizontal center, ~62% dari atas gambar */
/* ground.png di-cover dari bottom, jadi posisi rune di layar ~38% dari bawah */
.slime-wrap{
  position:absolute;
  z-index:4;
  left:50%;
  bottom:42%;
  transform:translateX(-50%) translateY(50%);
}

.slime-img{
  width:500px;
  height:auto;
  display:block;
  filter:
    drop-shadow(0 20px 60px rgba(0,0,0,0.6))
    drop-shadow(0 0 60px rgba(255,200,100,0.25));
}

/* ── AMBIENT GLOW di bawah slime ── */
.slime-glow{
  position:absolute;
  left:50%;
  bottom:42%;
  transform:translateX(-50%) translateY(50%);
  width:400px;
  height:60px;
  background:radial-gradient(ellipse, rgba(100,180,255,0.2) 0%, transparent 70%);
  z-index:3;
  pointer-events:none;
}
</style>
</head>
<body>
<div class="scene">
  <!-- Background layers -->
  <div class="layer-sky"></div>
  <div class="layer-mid"></div>
  <div class="layer-ground"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <!-- Logo di atas, di luar box -->
    <div class="sidebar-logo">
      <img src="assets/dashboard/logo.png" alt="Slime Runes">
    </div>
    <div class="sidebar-gap"></div>

    <!-- Box menu -->
    <div class="sidebar-box">
      <div class="sidebar-item active">
        <img src="assets/icons/sidebar/dashboard.png" alt=""><span>Dashboard</span>
      </div>
      <div class="sidebar-sep"></div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/heroes.png" alt=""><span>Heroes</span>
        <span class="sidebar-badge">3</span>
      </div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/equipment.png" alt=""><span>Equipment</span>
      </div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/alchemy.png" alt=""><span>Alchemy</span>
      </div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/collection.png" alt=""><span>Collection</span>
      </div>
      <div class="sidebar-sep"></div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/achievement.png" alt=""><span>Achievement</span>
      </div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/event.png" alt=""><span>Event</span>
        <span class="new-badge">NEW</span>
      </div>
      <div class="sidebar-sep"></div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/community.png" alt=""><span>Community</span>
      </div>

      <!-- Spacer dorong settings ke bawah -->
      <div class="sidebar-spacer"></div>
      <div class="sidebar-settings-sep"></div>
      <div class="sidebar-item">
        <img src="assets/icons/sidebar/settings.png" alt=""><span>Settings</span>
      </div>
    </div>
    <div class="sidebar-bottom-gap"></div>
  </aside>

  <!-- Topbar overlay di atas background -->
  <header class="topbar">
    <nav class="nav-icons">
      <div class="nav-icon active">
        <img src="assets/icons/navbar/home.png" alt=""><span>Home</span>
      </div>
      <div class="nav-icon">
        <img src="assets/icons/navbar/hero.png" alt=""><span>Hero</span>
      </div>
      <div class="nav-icon">
        <img src="assets/icons/navbar/inventory.png" alt=""><span>Inventory</span>
      </div>
      <div class="nav-icon">
        <img src="assets/icons/navbar/shop.png" alt=""><span>Shop</span>
      </div>
      <div class="nav-icon">
        <img src="assets/icons/navbar/quest.png" alt=""><span>Quest</span>
      </div>
    </nav>
    <div class="topbar-right">
      <div class="currency">
        <img src="assets/dashboard/coin.png" alt="">
        <span class="currency-val">1.42681</span>
      </div>
      <div class="currency">
        <img src="assets/dashboard/gem.png" alt="">
        <span class="currency-val">8,450</span>
      </div>
      <div class="currency-add">+</div>
      <button class="topbar-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <div class="notif-dot"></div>
      </button>
      <button class="topbar-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <div class="notif-dot"></div>
      </button>
    </div>
  </header>

  <!-- Ambient glow di rune -->
  <div class="slime-glow"></div>

  <!-- Slime -->
  <div class="slime-wrap">
    <img class="slime-img" src="assets/dashboard/slimo.png" alt="Slimo">
  </div>

  <!-- Right Panel -->
  <aside class="right-panel">
    <!-- Profile -->
    <div class="rp-profile">
      <div class="rp-avatar">
        <img src="assets/dashboard/slimo_mini.png" onerror="this.style.background='#ec4899'" alt="">
      </div>
      <div class="rp-info">
        <div class="rp-name">SlimeMaster</div>
        <div class="rp-lv">Lv. 35</div>
        <div class="rp-xpbar"><div class="rp-xpfill"></div></div>
        <div class="rp-xppct">68%</div>
      </div>
    </div>

    <div class="rp-gap"></div>

    <!-- Event -->
    <div class="rp-event">
      <img src="assets/dashboard/event_celestial.png" alt="">
      <div class="rp-notif"></div>
    </div>

    <div class="rp-gap"></div>

    <!-- Mystery Box -->
    <div class="rp-mystery">
      <img src="assets/dashboard/chest.png" alt="">
      <div class="rp-mystery-info">
        <div class="rp-card-title">Mystery Box</div>
        <div class="rp-card-sub">Try your luck!</div>
      </div>
      <div class="rp-notif"></div>
    </div>

    <div class="rp-gap"></div>

    <!-- Adventure -->
    <div class="rp-adventure">
      <img src="assets/dashboard/adventure.png" alt="">
      <div class="rp-notif"></div>
    </div>

    <div class="rp-gap"></div>

    <!-- Mini cards -->
    <div class="rp-mini-row">
      <div class="rp-mini">
        <div class="rp-mini-label">Daily Quest</div>
        <div class="rp-mini-val">3/6</div>
        <div class="rp-mini-sub">Complete for rewards</div>
      </div>
      <div class="rp-mini">
        <div class="rp-mini-label">Pass</div>
        <div class="rp-mini-val">Lv. 12</div>
        <div class="rp-mini-sub">Season ongoing</div>
      </div>
    </div>

    <div class="rp-bottom-gap"></div>
  </aside>

</div>
</body>
</html>
