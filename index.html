<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:#06050d;
}

/* ── SCENE WRAPPER ── */
.scene{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* ── LAYER: SKY (belakang) ── */
.layer-sky{
  position:absolute;
  inset:0;
  z-index:1;
  background:url('assets/dashboard/sky.png') center center / cover no-repeat;
}

/* ── LAYER: MID (tengah) ── */
.layer-mid{
  position:absolute;
  inset:0;
  z-index:2;
  background:url('assets/dashboard/mid.png') center bottom / cover no-repeat;
}

/* ── LAYER: GROUND / RUNE (paling depan background) ── */
.layer-ground{
  position:absolute;
  inset:0;
  z-index:3;
  background:url('assets/dashboard/ground.png') center bottom / cover no-repeat;
}

/* ── SLIME ── */
.slime-wrap{
  position:absolute;
  z-index:4;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.slime-img{
  width:min(480px, 45vw);
  height:auto;
  display:block;
  filter:
    drop-shadow(0 20px 60px rgba(0,0,0,0.6))
    drop-shadow(0 0 80px rgba(255,200,100,0.3));
  animation:slimefloat 3.5s ease-in-out infinite;
  transform-origin:bottom center;
}

@keyframes slimefloat{
  0%,100%{transform:translateY(0) rotate(-0.4deg);}
  50%{transform:translateY(-18px) rotate(0.4deg);}
}

/* ── AMBIENT GLOW di bawah slime ── */
.slime-glow{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(600px, 55vw);
  height:80px;
  background:radial-gradient(ellipse, rgba(255,200,80,0.18) 0%, transparent 70%);
  z-index:3;
  pointer-events:none;
  animation:glowpulse 3.5s ease-in-out infinite;
}
@keyframes glowpulse{
  0%,100%{opacity:0.7;transform:translateX(-50%) scaleX(1);}
  50%{opacity:1;transform:translateX(-50%) scaleX(0.85);}
}
</style>
</head>
<body>
<div class="scene">
  <!-- Background layers -->
  <div class="layer-sky"></div>
  <div class="layer-mid"></div>
  <div class="layer-ground"></div>

  <!-- Ambient glow di rune -->
  <div class="slime-glow"></div>

  <!-- Slime -->
  <div class="slime-wrap">
    <img class="slime-img" src="assets/dashboard/slimo.png" alt="Slimo">
  </div>
</div>
</body>
</html>
